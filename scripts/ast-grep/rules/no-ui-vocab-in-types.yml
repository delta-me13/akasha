id: no-ui-vocab-in-types
language: Rust
severity: error
message: 后端类型名不得编码 UI 呈现方式（Tab / Pane / Window / View）—— 见 docs/scope.md §1.2
note: |
  前端把 `Session` 渲染成标签页 / 面板 / 分屏 / 独立窗口**都行**，后端只按语义命名。
  一旦后端类型叫 `Tab`，等前端模型定型那天它就变成了谎话，而改名要动到 IPC 类型与生成物。

  改用这套词汇：`Session`（资源的归属单位）、`Transport`（字节载体）、
  `Connection`（一条 SSH 连接）。`Window` 尤其危险 —— 它与 Tauri 的窗口类型撞名。

  只拦**类型声明**（struct / enum / union / trait / type 别名），不拦对第三方类型的**引用**：
  `use tauri::Window;` 在 src-tauri/src/ 里是正当用法，本规则不会命中它。

  ⚠️ **按"词"匹配，不是按子串**（原来写的是裸 `(Tab|Pane|Window|View)` —— 那会把
  `Table` / `Panel` / `Viewport` 一起拦下，而它们都是另一批词）。名字按 CamelCase 的
  词边界判：前一个字符不是大写字母，后一个字符不是小写字母，即
  `(^|[^A-Z])(Tab|Pane|Window|View)([^a-z]|$)`。于是
  `NegTabProbe` / `TabItem` / `MyWindowSpec` / `WindowLike` 命中，
  `Table` / `Panel` / `Viewport` / `Previewer` 不命中。
files:
  - "src-tauri/src/**/*.rs"
rule:
  any:
    - kind: struct_item
    - kind: enum_item
    - kind: union_item
    - kind: trait_item
    - kind: type_item
  # 只看声明的**名字**，不看函数体与文档注释 —— 注释里讨论 "Tab" 是正当的。
  has:
    field: name
    regex: "(^|[^A-Z])(Tab|Pane|Window|View)([^a-z]|$)"
