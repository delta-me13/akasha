id: no-unsafe-outside-store
language: Rust
severity: error
# ⚠️ message 必须加引号：YAML 里反引号是保留指示符，不能出现在裸标量的开头。
message: "`unsafe` 只允许出现在存储模块（`src-tauri/src/store`）及其契约测试 —— 那是唯一需要碰 SQLCipher C API 的地方（AGENTS.md §3.4）"
note: |
  `unsafe` 的**唯一**正当理由是"必须调一个 C API，而它没有安全包装"。本仓库放行的是
  **整个存储模块**：`store.rs` 里那一处把口令送进 `sqlite3_key()`（ADR-0002 D4 —— 不允许用
  `PRAGMA key='…'` 文本形式，那会把口令写进 SQL 语句），它的契约测试为了钉住 SQLCipher
  的语义（空 key 会怎样、`rekey` 会不会换盐）也直接调 `sqlite3_key` / `sqlite3_rekey`。
  同一条理由下的第二处是 `src-tauri/src/store/protected.rs`（ADR-0009：Windows 上
  `SetProcessWorkingSetSize` 同样没有安全包装，而抬不抬工作集决定受保护页锁不锁得住 ——
  `VirtualLock` 的额度就是进程的最小工作集）。除此之外的任何 `unsafe` 都不是"不得不用"。

  为什么需要这条**规则**而不是只靠 lint：workspace 的 `unsafe_code` 只能是 `deny`
  而不能是 `forbid`（rustc 规定 `forbid` 无法被 `#[allow]` 覆盖，那样 `AGENTS.md` §3.4
  承诺的"单点 `#[allow(unsafe_code)]` + `// SAFETY:`"就永远写不出来）。`deny` 允许在
  任意地方加 `#[allow(unsafe_code)]`，所以"**只许写在哪**"这件事必须由本规则来守；
  "**必须怎么写**"由 §3.4 那三条 clippy lint 守。

  加了一处新 `unsafe` 时：先问"能不能不下沉到 C API"，不能的话把**理由**写进 `// SAFETY:`
  与对应 ADR，并把 `ignores` 放宽到那个文件 —— 放宽 `ignores` 等于改架构，要单独提交。
files:
  - "src-tauri/**/*.rs"
ignores:
  - "src-tauri/src/store.rs"
  - "src-tauri/src/store/**"
  # 契约测试为了钉住 SQLCipher 的语义（空 key 会怎样、`rekey` 会不会换盐）直接调
  # `sqlite3_key` / `sqlite3_rekey`；`format_migration` 也有一处。
  - "src-tauri/tests/sqlcipher_contract.rs"
  - "src-tauri/tests/format_migration.rs"
rule:
  # 匹配 `unsafe` 关键字本身：`unsafe { … }`、`unsafe fn`、`unsafe trait`、`unsafe impl`、
  # `unsafe extern` 一次全覆盖（`kind: unsafe` 在 ast-grep 里是非法写法）。
  # 注释与字符串里的 "unsafe" 不是 AST 节点，不会命中；`#[unsafe(no_mangle)]` 属性也不命中
  # —— 那是 edition 2024 对属性语法的要求，不是 unsafe 代码。
  pattern: unsafe
