# akasha-pty —— `Transport`：**通用字节载体**，不是 PTY 专属抽象。
#
# 名字里的 `pty` 是这个 crate 的**首个实现**，不是它的边界：同一个 trait 之后要装下
# SSH shell 通道与串口（docs/scope.md §2）。叫 `akasha-pty` 而不是 `PtySession` 一类，
# 是因为后者会容不下第二个后端 —— 词汇表的理由见 docs/scope.md §1.2。

[package]
name = "akasha-pty"
version = "0.1.0"
edition = "2024"
description = "akasha 的 Transport 抽象：通用字节载体 + portable-pty 实现"
# 桌面应用的一部分，不发布到 crates.io（同 akasha-core）。
publish = false

[dependencies]
portable-pty = "0.9.0"
# AGENTS.md §3.4：错误用 thiserror 分域定义。
thiserror = "2"
# 收掉整个会话（`teardown` 模块）要发 SIGKILL，而 workspace 的 `unsafe_code = "forbid"`
# 不允许我们自己写 `unsafe { libc::kill(…) }` —— 走 rustix 的**安全**封装。
# 它本来就在依赖树里（同一个版本），所以不新增下载，只是升格为直接依赖。
# 许可证 Apache-2.0 WITH LLVM-exception OR MIT，在 deny.toml 的 allow 列表内。
rustix = { version = "1", features = ["process"] }

[dev-dependencies]
# 吞吐基线（`just bench`）。**不新增依赖**：workspace 里本来就有它 —— `akasha` 的
# dev-dependencies 已经拉了同一个版本，所以这里只是把已有的那份也借给本 crate。
criterion = "0.8.2"

# 用 criterion 自己的 harness（`harness = false`）：libtest 的 `#[bench]` 只在 nightly 上，
# 而且它既没有基线对比也没有统计。
[[bench]]
name = "batching"
harness = false

[lints]
workspace = true
