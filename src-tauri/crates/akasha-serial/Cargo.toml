# akasha-serial —— `Transport` 的串口实现（`docs/scope.md` §2 的第三个后端）。
#
# 为什么单独一个 crate：串口要 `serialport`，而它在 Linux 上要用**系统库 libudev** 枚举端口
# （`scope.md` §8 风险 5）。把这份依赖关在一个 crate 里，"哪个平台链了 libudev"就变成
# **一份 manifest 上的事实**，而不是整棵依赖树上的猜测。
# `crates/*` 不得 `use tauri::*`（AGENTS.md §3.1）：本 crate 没有也不该有 Tauri 依赖。

[package]
name = "akasha-serial"
version = "0.1.0"
edition = "2024"
description = "akasha 的串口载体：Transport 的 serialport 实现"
# 桌面应用的一部分，不发布到 crates.io（同 akasha-pty / akasha-ssh）。
publish = false

[features]
# 默认开：Linux 上要它才有 USB 端口的信息（VID/PID/序列号）—— 那是 `serialport` 的枚举后端。
default = ["libudev"]
# ⚠️ 这个 feature 在**所有**平台都处于打开状态，而 libudev 仍然只在 Linux 上被链接：
# `serialport` 把那个 optional 依赖声明在
# `[target.'cfg(all(target_os = "linux", not(target_env = "musl")))'.dependencies]` 里，
# 于是 Windows / macOS 上这个 feature 激活的是一个**不存在的依赖**，什么都不编译。
# 判据（plan 0801 的验收）：`cargo tree --target x86_64-pc-windows-msvc` 里没有 libudev。
#
# 关掉它（`default-features = false`）仍然可用：Linux 上退化到 `serialport` 的 **sysfs**
# 枚举，不链 libudev —— 发行版缺 libudev 的开发包时走这条，不是硬失败。
libudev = ["serialport/libudev"]

[dependencies]
# 对外就是 `Transport` 这个门面（`scope.md` §2）：会话层与前端不为 serial 另立契约。
akasha-pty = { version = "0.1.0", path = "../akasha-pty" }
# ⚠️ `default-features = false` 是刻意的：上游的默认就是 `libudev`，直接吃默认
# 会让"链不链 libudev"变成 manifest 之外的事。版本钉到 manifest 里读到的那一份。
serialport = { version = "4.10.1", default-features = false }
# AGENTS.md §3.4：错误用 thiserror 分域定义。
thiserror = "2"

[dev-dependencies]
# 真实 tty 上的往返用例（步骤 5）：造一对 PTY，把**从端**当串口打开。
# 不新增依赖 —— 它早就在依赖树里（本 crate → akasha-pty → portable-pty）。
portable-pty = "0.9.0"

[lints]
workspace = true
