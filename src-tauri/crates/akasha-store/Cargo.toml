# akasha-store —— 存储层：把口令送进 SQLCipher、把库打开（`AGENTS.md` §3.1 分层最底层之一）。
#
# 它存在的理由很具体：**这是全仓库唯一允许出现 `unsafe` 的 crate**。
# 密钥必须经 `sqlite3_key()`（C API）送入，而不是 `PRAGMA key='…'` 文本形式（ADR-0002 D4）。
# 这件事由两个东西一起守：workspace 的 `unsafe_code = "deny"`（root Cargo.toml 里写了
# 为什么不能是 `forbid`）+ `scripts/ast-grep/rules/no-unsafe-outside-store.yml`（只放行本目录）。
#
# 依赖方向单向：`akasha` → `akasha-store`，反向视为架构违规（`AGENTS.md` §3.1）。
# 本 crate **不得** `use tauri::*`，由 `scripts/ast-grep/rules/no-tauri-in-core-crates.yml` 强制。

[package]
name = "akasha-store"
version = "0.1.0"
edition = "2024"
description = "akasha 的存储层：SQLCipher 库的打开、密钥送入与格式事实"
# 桌面应用的一部分，不发布到 crates.io（同时让 cargo-deny 跳过本 crate 的许可证表达式要求）。
publish = false

[dependencies]
# ⚠️ 两个词都不能少（`docs/scope.md` §6）：`bundled-sqlcipher` 单独用会去链**系统** OpenSSL，
# 四平台构建（尤其交叉编译）立刻变成负担，所以必须带 `-vendored-openssl`。
# 代价照实记：它把 `openssl-src` 拉进构建，**从源码编一遍 OpenSSL**（首次数分钟，
# 之后由 sccache 缓存）—— 这是"不撞系统 OpenSSL"的价格，不是配置失误。
#
# ⚠️ 版本**不是我们选的**：`victauri-plugin`（调试期嵌在 app 里的 MCP 服务）已经依赖
# `rusqlite ^0.32`，而 `libsqlite3-sys` 带 `links = "sqlite3"` —— cargo 规定同一个原生库
# **只能有一个版本**（两个版本会直接 `failed to select a version`，实测过）。
# 所以本 crate 只能跟着 0.32.x 走，实际落到 `libsqlite3-sys 0.30.1`（内含 SQLCipher 4.5.7）。
# 顺带的好处：features 会并集，app 里从此只有**一个** sqlite，而且是我们指定的那个。
#
# 0.32 的 rusqlite **没有默认特性**（也没有 `cache`，那是后来的版本才拆出来的），
# 所以这里不需要 `default-features = false`。`victauri-plugin` 那边开着 `bundled` + `hooks`，
# features 取并集 —— `bundled-sqlcipher` 本身就包含 `bundled`，两者并存是设计内的组合。
rusqlite = { version = "0.32.1", features = ["bundled-sqlcipher-vendored-openssl"] }
thiserror = "2.0.20"
# 口令的**内存防护**（plan 0406）：把口令放进一整页受保护内存，而不是普通堆。
# 上游做的是我们自己写不动的那几件系统调用（源码逐条核过，见 `src/passphrase.rs` 的文档）：
# Unix 静止态 `PROT_NONE`（读也要临时提权）、`mlock`（不进 swap）、
# Linux 的 `MADV_DONTDUMP`（不进 core dump）与 `MADV_WIPEONFORK`、释放时逐字节 volatile 擦零，
# **并且把调用方那个源 `Vec<u8>` 也擦零** —— 那是普通 `zeroize` 用法最容易漏掉的一份副本。
#
# 选 `Secret<[u8; N]>` 而不是 `MemSafe<Vec<u8>>`：后者只保护 `Vec` 的 24 字节头，
# 真正的字节还在普通堆上（上游文档把这条叫 "the `MemSafe<Vec<u8>>` pitfall"）。
#
# 代价照实记：① 依赖只有 `libc` / `winapi`，但它是**年轻的小库**（2025-02 首发、三个 owner、
# 759 行），所以它的 bug 就是我们的 bug —— 这是本 crate 里唯一一处"安全属性押在第三方实现上"，
# 判据与复核条件在 plan 0406 与 ADR-0002 §10；② 平台间不对称：Windows 静止态是
# `PAGE_READONLY`（可读），macOS 没有 DONTDUMP / WIPEONFORK；
# ③ `mlock` 失败会让构造**直接失败**（上游没有降级路径），见 `StoreError::MemoryProtection`。
memsafe = "1.0.2"

[lints]
# 继承全 workspace 的 lint（`unsafe_code = "deny"` 也在这里来的）。
# ⚠️ 不能在这里"继承 + 把 unsafe_code 放宽成 deny"：cargo 不允许部分覆盖
# （`cannot override workspace.lints`）。所以让 `unsafe` 只许出现在本 crate 的是
# `scripts/ast-grep/rules/no-unsafe-outside-store.yml`，不是这张表。
workspace = true
