[package]
name = "akasha-bw"
version = "0.1.0"
edition = "2024"
description = "akasha 的 Bitwarden CLI 客户端：获取、调用与状态"
publish = false

[dependencies]
akasha-store = { version = "0.1.0", path = "../akasha-store" }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
# `bw list items --raw` 交出来的是**整个 vault 的明文**（plan 0903）：那段缓冲读完就擦零，
# 而不是留在堆上等分配器回收。它**不是**受保护页 —— 页的大小是编译期常量，而这段可能几 MB；
# 受保护页留给真正长住的那两样（session key、私钥）。
zeroize = "1.9"
zip = { version = "0.6", default-features = false, features = ["deflate"] }
ureq = { version = "3", default-features = false, features = ["rustls"] }
tracing = "0.1.44"

[lints]
workspace = true
