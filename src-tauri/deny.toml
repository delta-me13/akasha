# cargo-deny 配置：许可证 / 漏洞 / 来源门禁。用法：just deny
#
# ⚠️ 不要直接用 `cargo deny init` 生成的模板：它的 [licenses] allow = [] 含义是
# **拒绝一切许可证**，启用后 check 会全红。下面是本项目实际接受的宽松许可证合集。
#
# 网络依赖：advisories 需要联网拉取 RustSec 数据库（缓存于 ~/.cargo/advisory-dbs）；
# licenses / bans / sources 不需要联网，离线也能跑（just deny-offline）。

[advisories]
ignore = []

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Zlib",
    "MPL-2.0",
    "Unicode-3.0",
    "CC0-1.0",
    "Unlicense",
    # ISC：宽松许可证（OSI 与 FSF 都认，条款与 MIT/BSD 同族）。
    # 具体来源是托盘那条链：`tray-icon` → `libappindicator` → `libappindicator-sys`
    # → `libloading 0.7.4`（plan 0301）。**只放行许可证，不忽略任何包**。
    "ISC",
    # CDLA-Permissive-2.0：**数据/内容**许可（Community Data License Agreement，
    # 无 copyleft，条款与 MIT 同族）。来源是 `webpki-roots 1.x` —— 它是 TLS 的根证书
    # 集合（一份数据），从 0.x 的 MPL-2.0 换成了这个许可。
    # ⚠️ 它**此前只在 dev 那条链上**（victauri-test → reqwest），而 plan 0902 让
    # `ureq`（akasha-bw 的 HTTP 客户端）把它带进了产物依赖 —— 所以这一条是那次改动的代价。
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.93

[licenses.private]
# 本 crate 是桌面应用、不发布到 crates.io（Cargo.toml 里 publish = false），
# 因此不需要许可证表达式；第三方依赖仍然逐个检查。
ignore = true

[bans]
# Tauri 的依赖树里重复版本是常态，deny 会不可用；但通配版本号必须拒绝。
multiple-versions = "warn"
wildcards = "deny"

# ── P1 的永久门禁：不依赖任何 OS 凭据库 ──────────────────────────────────────
#
# `scope.md` §1 的 P1（"凭据由本程序自己保管"）明确否决了 `keyring` 这一类方案。
# 它本来写在 ROADMAP 的验收里（"无任何 `keyring` 类依赖"，plan 0402）—— 但一次性的
# `cargo tree` 检查只在那一天成立，所以落成**常驻禁令**：由 `just deny-offline` 一直守着，
# 而 `deny-offline` 已经在本地的 `just ready` 与 CI 里。
#
# 为什么不禁 `security-framework` / `windows` / `dbus`：它们是**通用**平台绑定
# （TLS、窗口、IPC 都要用），P1 禁的是"把凭据交给操作系统的凭据库"这件事。
# 禁一个通用 crate 会把将来的 TLS 工作一起挡掉，那不是这条约束的意思。
#
# 名单里的两类：`keyring` 是入口（`keyring` v4 的默认特性会拉进
# `zbus-secret-service-keyring-store`），其余是各平台的后端 —— 列全是因为**它们能被绕过
# 入口单独依赖**，而多一个名字的成本是零。
# ⚠️ 名字不是猜的：`cargo add --dry-run keyring` 列出的特性名就是上游的实际命名。
deny = [
    "keyring",
    "secret-service",
    "linux-keyutils",
    "dbus-secret-service",
    "zbus-secret-service-keyring-store",
    "dbus-secret-service-keyring-store",
    "linux-keyutils-keyring-store",
    "apple-native-keyring-store",
    "windows-native-keyring-store",
    "android-native-keyring-store",
]

[sources]
# 只允许 crates.io：挡住被投毒的同名 git 依赖。
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
