[package]
name = "akasha"
version = "0.1.0"
description = "A Tauri App"
authors = ["cyrene"]
edition = "2024"

default-run = "akasha"

publish = false

[lib]

name = "akasha_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[workspace]
resolver = "2"

[workspace.lints.rust]

unsafe_code = "deny"

[workspace.lints.clippy]

unwrap_used = "warn"

undocumented_unsafe_blocks = "deny"
unnecessary_safety_comment = "deny"
unnecessary_safety_doc = "deny"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]

tauri = { version = "2", features = ["specta", "tray-icon"] }
tauri-plugin-opener = "2"

tauri-plugin-single-instance = "2.4.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
victauri-plugin = "0.8.8"
portable-pty = "0.9.0"
vte = "0.15.0"
thiserror = "2.0.20"

tracing = { version = "0.1.44", features = ["log-always"] }
tracing-subscriber = "0.3.23"
tauri-plugin-log = "2.9.1"

tauri-specta = { version = "=2.0.0-rc.25", features = ["typescript"] }
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
specta-typescript = "=0.0.12"

rusqlite = { version = "0.32.1", features = ["bundled-sqlcipher-vendored-openssl"] }

memsafe = "1.0.2"

russh = { version = "=0.63.3", default-features = false, features = ["ring", "rsa"] }
russh-sftp = "=3.0.0"
rand = "0.10"

serialport = { version = "4.10.1", default-features = false }

sha2 = "0.11"
zeroize = "1.9"
zip = { version = "0.6", default-features = false, features = ["deflate"] }
ureq = { version = "3", default-features = false, features = ["rustls"] }

tokio = { version = "1.53.1", features = ["rt-multi-thread", "time", "sync", "io-util", "net"] }

[target.'cfg(target_os = "linux")'.dependencies]

zbus = "5.9"

[target.'cfg(unix)'.dependencies]

rustix = { version = "1", features = ["process"] }

[target.'cfg(windows)'.dependencies]

# 读 HKLM 下的 PnP 设备项（plan 0803）：上游在 Windows 上把每个端口都报成"未知"，
# 而描述只有注册表给得出。用它的**安全包装**而不是手写 extern —— `unsafe` 只许出现在
# 存储模块（AGENTS.md §3.4，由 no-unsafe-outside-store 强制）。
# 它已经在这条依赖树里（tauri-build → embed-resource），所以版本跟随上游即可。
winreg = "0.55"

[features]

default = ["libudev"]

libudev = ["serialport/libudev"]

[dev-dependencies]
criterion = "0.8.2"
insta = "1.48.0"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time", "net", "sync"] }
victauri-test = "0.8.8"

[[bench]]
name = "batching"
harness = false

[lints]
workspace = true
