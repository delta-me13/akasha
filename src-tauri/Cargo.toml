[package]
name = "akasha"
version = "0.1.0"
description = "A Tauri App"
authors = ["cyrene"]
edition = "2024"
# 桌面应用，不发布到 crates.io。这同时让 cargo-deny 的 [licenses.private]
# 跳过本 crate 的许可证表达式要求（第三方依赖仍逐个检查）。
publish = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "akasha_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["specta"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
victauri-plugin = "0.8.8"
portable-pty = "0.9.0"
vte = "0.15.0"
thiserror = "2.0.20"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
tauri-plugin-log = "2.9.1"
tauri-specta = "2.0.0-rc.25"
specta = "2.0.0-rc.25"
specta-typescript = "0.0.12"


# 继承根 Cargo.toml 的 [workspace.lints]（unsafe_code = forbid、clippy::unwrap_used = warn）。
# 少了这一行，workspace lints 对本 crate 完全不生效。
[lints]
workspace = true

# release profile 已上移到根 Cargo.toml —— 成员里的 [profile.*] 会被**静默忽略**
# （cargo 每个 workspace 只认 root 的那个，见 docs/STATUS.md 坑 #18）。

[dev-dependencies]
criterion = "0.8.2"
insta = "1.48.0"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
victauri-test = "0.8.8"
