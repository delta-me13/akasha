# akasha-core —— Session 模型（`AGENTS.md` §3.1 分层里的最底层）。
#
# `[dependencies]` 为空**是有意为之**，不是"还没加"：本 crate 能脱离 app、
# 脱离 Tauri、脱离 async runtime 单测，这本身就是分层成立的证据。
# `cargo tree -p akasha-core --depth 0` 应当只有它自己。

[package]
name = "akasha-core"
version = "0.1.0"
edition = "2024"
description = "akasha 的 Session 模型：资源的归属单位（终端 / SFTP / 隧道 / 凭据库）"
# 桌面应用的一部分，不发布到 crates.io。这也让 cargo-deny 的 [licenses.private]
# 跳过本 crate 的许可证表达式要求（第三方依赖仍逐个检查）。
publish = false

[dependencies]

[lints]
workspace = true
