# akasha —— 根 Cargo workspace（ADR-0001 决策一）。
#
# 存在的理由不只是"多 crate 布局"：仓库根没有 Cargo.toml 时，一切**未显式指定 manifest**
# 的 cargo 命令在根目录直接失败（`cargo build` / `cargo metadata` / `cargo fmt --all`，
# 见 docs/adr/0001 §2.2 与 docs/STATUS.md 坑 #8）。有了本文件，那类问题整体消失。
#
# 依赖方向**单向**：`src-tauri` → `crates/*`；`crates/*` 不得 `use tauri::`（AGENTS.md §3.1，
# 由 .ast-grep/rules/no-tauri-in-core-crates.yml 强制）。

[workspace]
resolver = "2"
# ⚠️ 实测（2026-09-11）：`crates/*` 在 `crates/` 尚不存在时**不是**空匹配，而是硬错误 ——
# `failed to load manifest for workspace member .../crates/*`。所以 `crates/*` 要等
# plan 0103 建出首个成员后再加回，否则 `cargo metadata` 直接失败。
members = ["src-tauri"]

# 全 workspace 的 lint 基线。成员必须在自己的 Cargo.toml 里写 `[lints] workspace = true`
# 才会继承 —— 少了那一行，本节形同虚设。
[workspace.lints.rust]
# AGENTS.md §3.4：unsafe 默认禁止；确有必要时单点 `#[allow(unsafe_code)]` + `// SAFETY:` 注释。
unsafe_code = "forbid"

[workspace.lints.clippy]
# AGENTS.md §0 禁止 unwrap 出现在 command 边界与长驻任务中。这里设 warn 而非 deny：
# `just clippy` 带 `-D warnings`，所以生产代码里它实际就是错误；测试里的 unwrap 是断言手段，
# 由测试目标自己 `#![allow(clippy::unwrap_used)]` 显式豁免。
unwrap_used = "warn"

# release profile **必须**放在 workspace root：成员里的 [profile.*] 会被静默忽略
# （见 docs/STATUS.md 坑 #18）。
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
