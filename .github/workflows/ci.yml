# akasha 持续集成。
#
# 作业划分与门禁口径见 AGENTS.md §12。

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # 手动触发：重新验证某一次提交。
  workflow_dispatch:

# 同一 ref 的并发组至多保留一个进行中的运行；main 上的运行不被取代。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# 仅读取仓库内容。
permissions:
  contents: read

# 全部 run 步骤统一使用 bash。
defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  # 空值即不注入编译器包装器。
  RUSTC_WRAPPER: ""
  # Linux 系统依赖的唯一来源。
  APT_DEPS: >-
    libwebkit2gtk-4.1-dev build-essential curl wget file
    libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libudev-dev

jobs:
  # 完整门禁：执行的即本地那一条 just ready。
  checks-linux:
    name: 检查（Linux）
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: 系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends $APT_DEPS

      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master (2026-03-27)
        with:
          toolchain: stable
          components: clippy, rustfmt

      # 缓存 ~/.cargo 与 target；作用范围是本仓库的 workspace 根。
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
        with:
          workspaces: src-tauri

      # 预编译产物，附 SHA256 / attestation 校验。
      - uses: taiki-e/install-action@fa23953489c080190314742a9b907f8e97c6767c # v2 (2026-09-10)
        with:
          tool: just@1.58.0,cargo-nextest,cargo-deny

      # 不在 taiki-e/install-action 的支持列表内，经 npm 官方包安装（含预编译二进制）。
      - name: 安装 ast-grep
        run: npm install -g @ast-grep/cli@0.45.3

      - name: just ready
        run: just ready

  # 类型检查（含 tests / benches）：执行的即本地那一条 just check。
  checks-macos:
    name: 检查（macOS）
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master (2026-03-27)
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
        with:
          workspaces: src-tauri

      - uses: taiki-e/install-action@fa23953489c080190314742a9b907f8e97c6767c # v2 (2026-09-10)
        with:
          tool: just@1.58.0

      - name: 类型检查（含 tests / benches）
        run: just check

  # 类型检查（含 tests / benches）：执行的即本地那一条 just check。
  checks-windows:
    name: 检查（Windows）
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: ./.github/actions/windows-perl

      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master (2026-03-27)
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
        with:
          workspaces: src-tauri

      - uses: taiki-e/install-action@fa23953489c080190314742a9b907f8e97c6767c # v2 (2026-09-10)
        with:
          tool: just@1.58.0

      - name: 类型检查（含 tests / benches）
        run: just check

  # E2E（Linux）：执行的即本地那一条 just test-e2e（自包含：自行启动并回收 Vite 与 app）。
  # 与本平台的检查作业串行。
  e2e-linux:
    name: E2E（Linux）
    needs: checks-linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      # 矩阵格之间不因彼此失败而取消。
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # xvfb 提供 X11 显示。
      - name: 系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends $APT_DEPS xvfb

      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master (2026-03-27)
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
        with:
          workspaces: src-tauri

      - uses: taiki-e/install-action@fa23953489c080190314742a9b907f8e97c6767c # v2 (2026-09-10)
        with:
          tool: just@1.58.0

      # node / pnpm 版本以 mise.toml 为准。
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 12.3.4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26.8.2
          cache: pnpm

      # test-e2e 启动 Vite dev server，因此需要前端依赖。
      - name: 前端依赖
        run: pnpm install --frozen-lockfile

      # 串口域的平台面单元读数。
      - name: 串口单元测试
        run: just serial-unit

      - name: E2E
        run: xvfb-run -a just test-e2e

  # E2E（macOS）：执行的即本地那一条 just test-e2e（自包含：自行启动并回收 Vite 与 app）。
  # 与本平台的检查作业串行。
  e2e-macos:
    name: E2E（macOS）
    needs: checks-macos
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      # 矩阵格之间不因彼此失败而取消。
      fail-fast: false
      matrix:
        os: [macos-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master (2026-03-27)
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
        with:
          workspaces: src-tauri

      - uses: taiki-e/install-action@fa23953489c080190314742a9b907f8e97c6767c # v2 (2026-09-10)
        with:
          tool: just@1.58.0

      # node / pnpm 版本以 mise.toml 为准。
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 12.3.4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26.8.2
          cache: pnpm

      # test-e2e 启动 Vite dev server，因此需要前端依赖。
      - name: 前端依赖
        run: pnpm install --frozen-lockfile

      - name: 串口单元测试
        run: just serial-unit

      - name: E2E
        run: just test-e2e

  # E2E（Windows）：执行的即本地那一条 just test-e2e（自包含：自行启动并回收 Vite 与 app）。
  # 与本平台的检查作业串行。
  e2e-windows:
    name: E2E（Windows）
    needs: checks-windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      # 矩阵格之间不因彼此失败而取消。
      fail-fast: false
      matrix:
        os: [windows-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: ./.github/actions/windows-perl

      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master (2026-03-27)
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
        with:
          workspaces: src-tauri

      - uses: taiki-e/install-action@fa23953489c080190314742a9b907f8e97c6767c # v2 (2026-09-10)
        with:
          tool: just@1.58.0

      # node / pnpm 版本以 mise.toml 为准。
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 12.3.4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26.8.2
          cache: pnpm

      # test-e2e 启动 Vite dev server，因此需要前端依赖。
      - name: 前端依赖
        run: pnpm install --frozen-lockfile

      - name: 串口单元测试
        run: just serial-unit

      - name: E2E
        run: just test-e2e
