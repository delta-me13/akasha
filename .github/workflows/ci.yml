# akasha CI —— **只维护 GitHub Actions 这一份**。
#
# 三个 job：
#   ① `checks-linux`  —— 完整门禁，跑的**就是本地那一条 `just ready`**
#   ② `checks-other`  —— Windows / macOS 只做类型检查
#   ③ `e2e`           —— Ubuntu + xvfb，起真实 app 跑 Victauri 冒烟与集成测试
#
# ## 为什么完整门禁只在 Linux 跑一次
#
# fmt / clippy / docs-check 的结论与平台无关，放进矩阵只是把时间乘三。
# 平台差异（PTY / serial / ssh 的 cfg 分支）由 ② 的 `just check` 拦住 ——
# 目标是"挡 cfg 错误"，不是"三平台各跑一遍全套"。
#
# **出包不在本文件的目标内**：打包需要真实主机（WiX / NSIS / WebView2 bootstrapper 都不行），
# 那是发布流程的事。
#
# ## 曾经的双 forge 兼容层（已放弃）
#
# 本文件一度要同时喂 Gitea Actions 与 GitHub Actions，代价是整份工作流被压在
# 两边**共有的子集**里（无 `runner.*` 上下文、`runs-on` 只能简单形式、表达式只有
# `always()`、只能有 Linux runner）。2026-09-11 评估后放弃，**理由与那份约束清单
# 留在 [`docs/plans/0102`](../../docs/plans/0102-ci-platform-matrix.md) 的「放弃记录」**。
# 所以：不要为了别的 forge 再加兼容层；若哪天真的要在别处跑，先读那段记录。

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  JUST_VERSION: 1.58.0
  # 唯一一份系统依赖列表。Tauri 官方 Debian/Ubuntu 列表：
  # https://v2.tauri.app/start/prerequisites/
  # 注意是 libayatana-appindicator3-dev —— 旧名 libappindicator3-dev 在
  # ubuntu-latest 上已经不存在（STATUS 坑 #10）。
  APT_DEPS: >-
    libwebkit2gtk-4.1-dev build-essential curl wget file
    libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

jobs:
  # ── ① 静态门禁 ──────────────────────────────────────────────────────────────
  # 跑的**就是本地那一条 `just ready`** —— 门禁只有一处定义，避免 CI 与本地漂移。
  # 不要在这里另写 cargo 命令：那样两处必然分叉，而分叉的方向总是"CI 比本地松"。
  checks-linux:
    name: 检查（Linux）
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: 系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends $APT_DEPS

      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master (2026-06)
        with:
          toolchain: stable
          components: clippy, rustfmt

      # 缓存 ~/.cargo 与 target。rust-cache 的键自动含操作系统与 rustc 版本，
      # 所以平台之间天然分键，不需要手写 key。
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8

      # just 不在 taiki-e/install-action 的工具列表里，用官方固定版本资产。
      # **按 uname 选资产，而不是 `${{ runner.arch }}`**：macos-latest 已是 arm64，
      # 装错架构会以 "bad CPU type in executable" 失败，而那个报错完全不提架构。
      # 未覆盖的组合直接失败，不退回一个"大概能用"的二进制。
      - name: 安装 just
        shell: bash
        run: |
          bin="$HOME/.local/bin"
          mkdir -p "$bin"
          case "$(uname -s)-$(uname -m)" in
            Linux-x86_64)        target=x86_64-unknown-linux-musl ;;
            Darwin-arm64)        target=aarch64-apple-darwin ;;
            Darwin-x86_64)       target=x86_64-apple-darwin ;;
            MINGW*|MSYS*|CYGWIN*) target=x86_64-pc-windows-msvc ;;
            *) echo "::error::未覆盖的平台组合：$(uname -s)-$(uname -m)"; exit 1 ;;
          esac
          url="https://github.com/casey/just/releases/download/${JUST_VERSION}/just-${JUST_VERSION}-${target}"
          case "$target" in
            *windows*)
              curl --proto '=https' --tlsv1.2 -sSfL "$url.zip" -o "$bin/just.zip"
              unzip -oq "$bin/just.zip" -d "$bin"
              rm -f "$bin/just.zip"
              ;;
            *)
              curl --proto '=https' --tlsv1.2 -sSfL "$url.tar.gz" | tar xz -C "$bin"
              ;;
          esac
          echo "$bin" >> "$GITHUB_PATH"

      # cargo-nextest / cargo-deny 走预编译 GitHub Releases
      - uses: taiki-e/install-action@fa23953489c080190314742a9b907f8e97c6767c # v2 (2026-09-10)
        with:
          tool: cargo-nextest,cargo-deny

      # 结构护栏（ast-grep）用官方 npm 包，自带预编译二进制。
      # --prefix 装到 ~/.local，避免全局写权限问题。
      - name: 安装 ast-grep
        run: npm install -g --prefix "$HOME/.local" @ast-grep/cli

      # 门禁只有这一处定义：fmt-check + lint(clippy + ast-grep) + test + deny-offline + docs-check
      - name: just ready
        run: just ready

  # ── ② 其余平台 ──────────────────────────────────────────────────────────────
  # 只做类型检查（含 tests / benches），走 crate 级 `check` 的转发配方，不另写 cargo 命令。
  checks-other:
    name: 检查（${{ matrix.os }}）
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      # 一个平台红了不必掐掉另一个：平台差异要一次看全，而不是修一个等一轮。
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master (2026-06)
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8

      - name: 安装 just
        shell: bash
        run: |
          bin="$HOME/.local/bin"
          mkdir -p "$bin"
          case "$(uname -s)-$(uname -m)" in
            Linux-x86_64)        target=x86_64-unknown-linux-musl ;;
            Darwin-arm64)        target=aarch64-apple-darwin ;;
            Darwin-x86_64)       target=x86_64-apple-darwin ;;
            MINGW*|MSYS*|CYGWIN*) target=x86_64-pc-windows-msvc ;;
            *) echo "::error::未覆盖的平台组合：$(uname -s)-$(uname -m)"; exit 1 ;;
          esac
          url="https://github.com/casey/just/releases/download/${JUST_VERSION}/just-${JUST_VERSION}-${target}"
          case "$target" in
            *windows*)
              curl --proto '=https' --tlsv1.2 -sSfL "$url.zip" -o "$bin/just.zip"
              unzip -oq "$bin/just.zip" -d "$bin"
              rm -f "$bin/just.zip"
              ;;
            *)
              curl --proto '=https' --tlsv1.2 -sSfL "$url.tar.gz" | tar xz -C "$bin"
              ;;
          esac
          echo "$bin" >> "$GITHUB_PATH"

      - name: 类型检查（含 tests / benches）
        shell: bash
        run: just check

  # ── ③ E2E：需要真实运行的 app，只做 Linux ───────────────────────────────────
  # 只依赖 ①：静态门禁不过就不必烧 CI 时间起 app。
  # **不依赖 ②**：平台类型检查与 E2E 是**互相独立的信号**，串成一条链只会让
  # "Windows 红了"顺带吃掉 E2E 的结论。
  e2e:
    name: E2E（真实 app + Victauri）
    runs-on: ubuntu-latest
    needs: checks-linux
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: 系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends $APT_DEPS xvfb

      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master (2026-06)
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8

      # 显式给 --manifest-path：workspace root 在 src-tauri/（ADR-0004），
      # 这样写不依赖当前目录，也不依赖 job 的 WORKDIR。
      - name: 构建
        run: cargo build --manifest-path src-tauri/Cargo.toml

      # 用 cargo metadata 询问产物路径，而不是猜。
      - name: 解析产物路径
        run: |
          echo "TARGET_DIR=$(cargo metadata --manifest-path src-tauri/Cargo.toml \
            --format-version 1 --no-deps | jq -r '.target_directory')" >> "$GITHUB_ENV"

      # 不要再写 `$(cargo metadata | jq '.packages[0].name')`：workspace 里第一个成员
      # 是 akasha-core，不是 app crate；而且 crate 名不一定等于 bin 名。
      - name: 在 xvfb 下启动 app
        run: |
          xvfb-run -a "$TARGET_DIR/debug/akasha" &
          echo "APP_PID=$!" >> "$GITHUB_ENV"

      - name: Victauri 冒烟测试
        uses: 4DA-Systems/victauri/.github/actions/victauri-test@v0.8.8
        with:
          check: "true"
          victauri-version: "0.8.8"

      - name: 集成测试
        run: cargo test --manifest-path src-tauri/Cargo.toml --test integration -- --test-threads=1
        env:
          VICTAURI_E2E: "1"

      # always()：前面任何一步失败，也要把这个后台 app 收掉。
      - name: 清理
        if: always()
        run: |
          if [ -n "${APP_PID:-}" ]; then
            kill "$APP_PID" 2>/dev/null || true
          fi
